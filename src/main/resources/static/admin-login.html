
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISON | Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #292522;
            font-family: Arial, sans-serif;
        }
        .login-box {
            background: white;
            width: min(390px, 92%);
            padding: 35px;
            border-radius: 12px;
        }
        h1 { text-align: center; letter-spacing: 5px; }
        h2 { text-align: center; }
        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 13px;
            border-radius: 6px;
        }
        input { border: 1px solid #ddd; }
        button {
            border: 0;
            color: white;
            background: #292522;
            cursor: pointer;
        }
        #message { text-align: center; }
    </style>
</head>
<body>

<div class="login-box">
    <h1>MAISON</h1>
    <h2>Administrator Login</h2>

    <form id="admin-login-form">
        <input id="admin-email" type="email"
               placeholder="Administrator email" required>

        <input id="admin-password" type="password"
               placeholder="Password" required>

        <button type="submit">LOGIN</button>
    </form>

    <p id="message"></p>
</div>

<script src="admin-login.js"></script>
</body>
</html>
