<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISON | Customer Account</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f1ec;
            font-family: Arial, sans-serif;
            color: #292522;
        }
        .account-box {
            width: min(420px, 92%);
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 35px #00000012;
        }
        h1 { text-align: center; letter-spacing: 5px; }
        h2 { text-align: center; font-size: 20px; }
        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 0;
            border-radius: 7px;
            background: #292522;
            color: white;
            cursor: pointer;
        }
        .switch {
            background: transparent;
            color: #292522;
            text-decoration: underline;
        }
        #message { text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="account-box">
    <h1>MAISON</h1>

    <div id="login-panel">
        <h2>Welcome Back</h2>

        <form id="login-form">
            <input id="login-email" type="email"
                   placeholder="Email address" required>

            <input id="login-password" type="password"
                   placeholder="Password" required>

            <button type="submit">LOGIN</button>
        </form>

        <button class="switch" id="show-register">
            Create a new account
        </button>
    </div>

    <div id="register-panel" hidden>
        <h2>Create Account</h2>

        <form id="register-form">
            <input id="register-name" placeholder="Full name" required>
            <input id="register-email" type="email"
                   placeholder="Email address" required>
            <input id="register-phone" type="tel"
                   placeholder="Phone number" required>
            <input id="register-password" type="password"
                   placeholder="Password (at least 8 characters)"
                   minlength="8" required>

            <button type="submit">CREATE ACCOUNT</button>
        </form>

        <button class="switch" id="show-login">
            Already have an account? Login
        </button>
    </div>

    <p id="message"></p>
</div>

<script src="customer-auth.js"></script>
</body>
</html>
